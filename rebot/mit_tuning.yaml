# MIT 保持の調整値（rebot/arm_state.py が「有効化」のたびに読み直す。サービスの再起動は不要）。
# 書き換えたら、ページで「トルクを切る」→「有効化」で反映される。単位: N m・rad・s。
#
# 指令: tau = kp (q_cmd - q) + kd (v_plan - v) + g(q) + friction * tanh(v_dir / friction_v)
#   g(q): SDK の URDF の重力（公式 dynamics）。v_dir: 計画経路の進む向き（経路の時計が遅れても向きは保つ）。
#   保持中は v_dir = 0 なので摩擦項は入らない（静止摩擦は外側の PI 補正が扱う）。

# クーロン摩擦（移動中だけ、進む向きに加える）。joint2/3 は rebot/reBotArm_control_py/example/grav_params.json の fc
# （このアームで auto_gravity_calib.py が当てはめた値）。ほかは未測定のため 0。
# 2026-10-14: MIT 化後、休止姿勢 → 校正姿勢 17 の移動で joint3 が 0.033 rad 遅れ、手先 20 mm で停止した対策。
friction_nm:
  joint1: 0.0
  joint2: 0.90
  joint3: 1.71
  joint4: 0.0
  joint5: 0.0
  joint6: 0.0

options:
  friction_v: 0.02      # rad/s, 摩擦項の向きを切り替える幅（0 付近をなめらかにする）
  # kp / kd を SDK yaml から変える場合だけ書く（例: kp_joint3: 160.0）。未記入なら yaml の値。

# グリッパー（モーター gripper、MIT）。開く・離す = 位置指令（速さ制限つき）、挟む = 閉じる向きの一定トルク（ばねなし）。
# 換算は sim/scene.toml [jaw] と同じ実測値（2026-10-14、定規: 0 / 50 / 100 mm = -0.022 / -2.929 / -5.896 rad、遊び約 1 mm）。
gripper:
  full_open_rad: -5.896     # 最大開口のモーター角
  max_gap_m: 0.100          # 最大開口（顎の内側の隙間）
  grip_torque_nm: 0.5       # 挟むトルク。0.25 では空のまま閉じても 23.3 mm で止まった（顎の摩擦、2026-10-14 07:11）
  speed_rad_s: 2.0          # 開く・離すの速さ（約 34 mm/s）
  kp: 8.0                   # 位置保持のばね（SDK yaml の MIT kp）
  kd: 1.0
  grip_kd: 0.3              # 挟むときの減衰
  miss_margin_m: 0.004      # 予定の幅よりこれ以上閉じたら「つかみ損ね」（8 mm では 23.3 mm の空振りを把持中と判定した）

# 衝突停止（移動中だけ）。抵抗 r = モーター実測トルク − 重力 ff − 摩擦 ff を、計画の進む向きに測った値（余計に押している量）。
# 大きさではなく「増え続けている」ことで止める（2026-10-14 依頼者）。上限の絶対値は使わない
# （休止姿勢からの持ち上げで、ストッパーが支えていた重さをモーターが引き受けただけで止まったため）。
# 記録の再生: cd rebot && <venv>/bin/python contact_replay.py ../run/arm_trace_last.jsonl [--wall 2:200 --wall 3:30:soft]
contact:
  # false: 衝突停止を使わない（依頼者 2026-10-15: 校正の自動巡回中に joint1 で誤停止したため一旦全部切る）。
  # 追従の逸脱停止（0.08 rad / 手先 20 mm）は残る。true に戻せば以下の判定が有効になる。
  enabled: false
  # 直近の最小値（モデルより小さい = ストッパーなどが支えていたときは 0 とみなす）からの増加がこれを超え、
  # しかも今が最大付近（まだ増えている）なら停止。joint1〜6、N m。実機の自由な移動では最大 0.6 / 2.0 / 1.5 / 0.2 / 0.1 / 0.2。
  rise_nm: [1.2, 3.0, 3.0, 0.6, 0.5, 0.5]
  # 柔らかい物への押し込み: 進んだ量に比例して抵抗が増える（直線の当てはまり r^2 >= spring_r2、
  # 10 mrad 以上の移動、増加は rise_nm の半分以上）。傾き N m/rad の下限。
  spring_nm_per_rad: [8.0, 10.0, 10.0, 3.0, 3.0, 3.0]
  spring_travel_rad: 0.010
  spring_r2: 0.85
  spring_rise_frac: 0.5
  window_s: 1.5          # 判定に使う直近の時間
