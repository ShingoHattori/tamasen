# 関節の零点補正（ソフトウェアのみ。モーターには書き込まない）。
#   モデルの関節角 = モーターの関節角 + offset
# rebot/arm_state.py が起動時と、読み取り専用からの「有効化」のたびに読み直す。
# 公開する関節角（state.json の pos）・FK・重力・sim の同期・経路はモデルの角度、指令はモーターの角度に戻して送る。
# 全部 0 にすれば補正なし（元の動作）。|offset| <= 10 deg。
#
# 2026-10-14 06:33 採用した hand-eye 校正（oak/calib/handeye/20261014、16 サンプル、関節零点ずれを同時推定）の値。
#   joint2 -1.10 ±0.19, joint3 +0.61 ±0.22, joint4 -0.22 ±0.22, joint5 -6.12 ±0.26 deg。
#   先の 17 サンプル（別に集めたもの）では -0.79 / +1.01 / -0.36 / -5.97 deg。joint5 は 2 回とも約 -6 deg で再現。
#   joint1・joint6 は校正では決まらない（camera↔base・マーカー取り付けに吸収）ので 0。
#   joint5 は手合わせでも確認: 前腕とグリッパーを定規でまっすぐにしたときモーター角 +7.03 / +7.77 deg
#   （= offset -7.0 / -7.8 deg 相当。柔らかい物に触れていたため参考値）。
#   採用した T_cam_base はこの零点ずれと組で求めたもの。値を変えたら hand-eye も解き直す。
offsets_deg:
  joint1: 0.0
  joint2: -1.101
  joint3: 0.615
  joint4: -0.220
  joint5: -6.118
  joint6: 0.0
