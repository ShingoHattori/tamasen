name: TamasenScan
options:
  bundleIdPrefix: jp.ac.tsukuba.hpcs.tamasen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 2HRV6ZVAUB
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TamasenScan:
    type: application
    platform: iOS
    sources: [TamasenScan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.ac.tsukuba.hpcs.tamasen.scan
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TamasenScan
        INFOPLIST_KEY_NSCameraUsageDescription: 深度カメラで物体をスキャンします
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIStatusBarHidden: YES
