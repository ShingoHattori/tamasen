# ArUco マーカーと物体モデルの登録。単位は mm。vision.py が起動中もこのファイルの変更を読み直す。
#
# 未計測の値は nan（数値）または ""（文字列）のままにしておく。推測値で埋めないこと:
# 埋まっていない項目はブロックの姿勢計算に使われず、確認画面に「未登録」として表示される。

dictionary = "4X4_50"

# ---------------------------------------------------------------------------------------------
# 直方体ブロック
#
# 物体座標の定義（右手系、原点は直方体の中心）:
#   +Z : ID 0 を貼った 67 x 78 面の外向き法線（この面を「上面」と呼ぶ）
#   -Y : ID 3 を貼った 67 x 31 面の外向き法線（この面を「正面」と呼ぶ）
#   +X : 正面を見て上面が上にあるとき、右向き
# 寸法は X / Y / Z = 67 / 78 / 31。
#
# 面図（マーカーの取り付けを記入するときの見方）:
#   上面 (+Z) : 真上から見て、正面 (ID 3 の面) が手前 = 図の下側。図の右 = +X、上 = +Y
#   正面 (-Y) : 正面から見て、上面 (ID 0 の面) が図の上側。      図の右 = +X、上 = +Z
# ---------------------------------------------------------------------------------------------
[block]
size_mm = [67.0, 78.0, 31.0]

# 取り付け項目（ブロック用マーカー）:
#   size_mm     マーカー黒枠の外寸（一辺）
#   corner      マーカーが寄っている面の角（面図での位置）:
#               "top-left" | "top-right" | "bottom-left" | "bottom-right"
#   offset_x_mm その角の左右の辺から、マーカー黒枠の近い辺までの距離
#   offset_y_mm その角の上下の辺から、マーカー黒枠の近い辺までの距離
#   x_axis      確認画面でマーカーに描かれる x 軸（赤）が、面図で向いている方向:
#               "right" | "left" | "up" | "down"
#               （マーカーの印刷上の向き。y 軸（緑）は x 軸を反時計回りに 90° 回した向き）

[marker.0]
role = "block"
face = "+Z"
size_mm = nan
corner = ""
offset_x_mm = nan
offset_y_mm = nan
x_axis = ""

[marker.3]
role = "block"
face = "-Y"
size_mm = nan
corner = ""
offset_x_mm = nan
offset_y_mm = nan
x_axis = ""

# ---------------------------------------------------------------------------------------------
# グリッパー根元のマーカー（顎の開閉では動かない部分）
# grip_* は ID 1 のマーカー座標から把持中心への固定変換。校正するまで calibrated = false のまま。
# ---------------------------------------------------------------------------------------------
[marker.1]
role = "gripper"
size_mm = nan

[marker.1.grip]
calibrated = false
translation_mm = [nan, nan, nan]
rotation_rpy_deg = [nan, nan, nan]
