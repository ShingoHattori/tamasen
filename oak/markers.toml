# ArUco マーカー・ブロック・基準カードの登録。vision.py は起動中もこのファイルの変更を読み直す。
#
# 単位: このファイルでは長さ mm、角度 deg（キー名の _mm / _deg で明示）。読み込み時に m・rad へ変換し、
#       プログラム内部と state.json はすべて m・rad。
#
# 値の状態（*_status）:
#   "unset"      未入力。値があっても使わない（0 や単位行列で代用しない）
#   "sample"     サンプル値・仮定。表示はするが「仮」と明示し、校正値としては扱わない
#   "measured"   実測済み（依頼者の実測、または画像での確認を経たもの）
#   "calibrated" 校正済み（観測データから推定し、検証したもの）
#
# 座標系と変換の向き（T_a_b は b 座標の点を a 座標へ移す: p_a = T_a_b · p_b）:
#   cam   カラーカメラ（OpenCV: x 右, y 下, z 前方）
#   m<ID> マーカー（中心が原点。印刷の向きで x 右, y 上, z はマーカー面から外向き。
#         ArUco の四隅順 0..3 = 印刷の左上・右上・右下・左下）
#   world 暫定 world = ID 2 のマーカー座標そのもの（Z=0 はカード表面。床面ではない）
#   obj   ブロック中心
#   base  アーム台座（カメラとの位置合わせは未実施）

dictionary = "DICT_4X4_50"

# ---------------------------------------------------------------------------------------------
# 直方体ブロック
#
# 物体座標 obj の定義（右手系、原点は直方体の中心、X/Y/Z の寸法 = 67/78/31 mm）:
#   +Z : ID 0 を貼った 67 x 78 面の外向き法線（この面を「上面」と呼ぶ）
#   -X : ID 3 を貼った 78 x 31 面の外向き法線（この面を「正面」と呼ぶ）
#        依頼者確認（2026-10-13）: ID 3 の面は 78 x 31 mm（当初の「67 x 31」は誤り。画像で約 78 mm と推定し、依頼者が実測で確認）
#   +Y : 右手系から決まる（正面を見て上面が上のとき、左向き）
#   78 x 31 面と 67 x 78 面は必ず 78 mm の辺で隣り合うので、この定義は物理的な配置を仮定しない。
#   決まっていないのは「各面のどの角にマーカーがあるか」と「マーカーの回転」で、画像で確認して記入する。
#
# 面図（取り付けを記入するときの見方）:
#   上面 (+Z) : 真上から見て、正面（ID 3 の面）が図の下側。図の右 = -Y、上 = +X（図の横 78 mm、縦 67 mm）
#   正面 (-X) : 正面から見て、上面（ID 0 の面）が図の上側。図の右 = -Y、上 = +Z（図の横 78 mm、縦 31 mm）
#   依頼者の「左上」は依頼者の見方での左上で、この面図の左上と同じとは限らない。
# ---------------------------------------------------------------------------------------------
[block]
size_mm = [67.0, 78.0, 31.0]
size_status = "measured"

# ブロック用マーカーの取り付け:
#   size_mm      黒い正方形の一辺（白い余白を除く）
#   offset_x_mm  寄っている角の左右の辺から黒枠まで / offset_y_mm 上下の辺から黒枠まで
#   corner       寄っている角（面図での位置）: "top-left" | "top-right" | "bottom-left" | "bottom-right"
#   x_axis       マーカーの x 軸（赤）が面図で向く方向: "right" | "left" | "up" | "down"
#   mount_status corner と x_axis を画像で確認したら "measured" にする。"unset" の間は取り付け変換を作らない
#   mount_evidence 確認に使った画像（保存した静止画のパスなど）

[marker.0]
role = "block"
face = "+Z"
size_mm = 20.0
size_status = "measured"
offset_x_mm = 3.0
offset_y_mm = 3.0
offset_status = "measured"
corner = "bottom-left"
x_axis = "left"
mount_status = "measured"
mount_evidence = "evidence/mount-20261013/（元 output/snapshots/20261013-090030-716。両面が写った静止画。単面の外形照合 mount_0/3.jpg で各面の位置、ID 3 の姿勢＋取り付けから予測した ID 0 の四隅が検出と平均 4.9 px で一致。次点 11 px）"

[marker.3]
role = "block"
face = "-X"
size_mm = 20.0
size_status = "measured"
offset_x_mm = 3.0
offset_y_mm = 3.0
offset_status = "measured"
corner = "bottom-left"
x_axis = "left"
mount_status = "measured"
mount_evidence = "evidence/mount-20261013/（元 output/snapshots/20261013-090030-716。両面が写った静止画。単面の外形照合 mount_0/3.jpg で各面の位置、ID 3 の姿勢＋取り付けから予測した ID 0 の四隅が検出と平均 4.9 px で一致。次点 11 px）"

# ---------------------------------------------------------------------------------------------
# グリッパー根元のマーカー（顎の開閉では動かない本体部分）
# grip: ID 1 マーカー座標 → 把持中心の固定変換 T_m1_grip。校正するまで status = "unset"。
# ---------------------------------------------------------------------------------------------
[marker.1]
role = "gripper"
size_mm = 20.0
size_status = "measured"

[marker.1.grip]
# 2026-10-13 治具（両顎で挟んだ ID 3 マーカー、中心 = 把持中心）を ID 1 と同時観測（20 フレーム平均）。
# 治具の黒枠はステレオ深度から 30.4 mm（依頼者申告の 40 mm と矛盾。同じ方法で ID 1 = 20.1 mm、ID 2 = 40.7 mm）→ 30 mm で計算。
status = "measured"
translation_mm = [-0.8, -59.9, -28.4]
rotation_rpy_deg = [-1.0, 1.0, -89.6]

# ---------------------------------------------------------------------------------------------
# 基準カード（暫定 world 座標）
# world = ID 2 のマーカー座標。原点 = マーカー中心、軸 = マーカー軸、Z=0 = マーカー表面。
# 床面は Z = -card_thickness だが、厚みは未測定のため床の高さは未校正。
# physically_fixed: カードをテープ等で固定したら true にする（依頼者の申告）。
# ---------------------------------------------------------------------------------------------
[marker.2]
role = "world_reference"
size_mm = 40.0
size_status = "measured"
card_thickness_mm = nan
card_thickness_status = "unset"
physically_fixed = false

# ---------------------------------------------------------------------------------------------
# 把持中心の確認用治具。依頼者の決定（2026-10-13）: 印刷シートの ID 3（40 mm 版）を治具に使う。
# ID 3 はブロックにも貼ってあるので、vision.py の「治具モード」中だけ ID 3 を治具（この寸法）として扱い、
# ブロック推定には使わない。治具モード中はブロックを画角外に出すこと（同じ ID が 2 つ写ると両方不採用）。
# 治具の作り方: 薄い板に貼り、両顎を閉じて板を挟む（指は連動して対称に閉じるので板面 = 両顎の中央面）。
#   マーカーはカメラ側に向け、顎から外にはみ出す位置に貼る。
# jig_to_grip_mm: 治具マーカー座標（中心が原点、印刷の右 x・上 y・面から外向き z）で見た把持中心の位置。
#   板面が中央面なので z = -板厚/2。x, y はマーカー中心からパッドの中ほどまで（挟んだ状態で実測）。
# ---------------------------------------------------------------------------------------------
[grip_jig]
id = 3
size_mm = 30.0
size_status = "measured"       # ステレオ深度で 30.4 mm（依頼者申告は 40 mm。要確認）
# 依頼者情報 2026-10-13: 両顎を閉じるとパッドがマーカー両端（中心から左右 20 mm）に当たり、奥行き方向のずれは 0。
# よって把持中心 = 治具マーカー中心。顎で挟んだ状態で記録すること（机に置いただけでは成り立たない）。
jig_to_grip_mm = [0.0, 0.0, 0.0]
jig_to_grip_status = "measured"
